<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="data:," />
        <title>Family Tree</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;1,400&family=Roboto+Condensed:wght@500;700&display=swap"
        />
    </head>
    <body>
        <header>
            <h1 id="title"></h1>
            <p id="author"></p>
            <input
                id="search"
                type="search"
                list="names"
                placeholder="Find a person…  ( / )"
                aria-label="Find a person"
                autocomplete="off"
            />
            <datalist id="names"></datalist>
        </header>

        <aside id="panel" hidden aria-live="polite">
            <button id="panel-close" aria-label="Close">&times;</button>
            <h2 id="panel-name"></h2>
            <p id="panel-house"></p>
            <dl id="panel-list"></dl>
        </aside>

        <nav id="pad" aria-label="Pan the view">
            <button data-dir="up" aria-label="Pan up">&#9650;</button>
            <button data-dir="left" aria-label="Pan left">&#9664;</button>
            <button data-action="fit" aria-label="Fit whole tree">&#9711;</button>
            <button data-dir="right" aria-label="Pan right">&#9654;</button>
            <button data-dir="down" aria-label="Pan down">&#9660;</button>
        </nav>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
